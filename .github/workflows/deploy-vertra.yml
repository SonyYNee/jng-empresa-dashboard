name: CI/CD → VertraCloud Deploy

on:
  push:
    branches: [ main, master ]

env:
  IMAGE_NAME: jngempresa/dashboard
  IMAGE_TAG: latest
  VERTRA_API_URL: https://api.vertracloud.example
  PROJECT_NAME: dashboard
  DB_NAME: dashboard
  APP_NAME: dashboard-app
  DOMAIN: jngturismos.example

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          push: true
          tags: docker.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

  deploy-vertra:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Wait for a few seconds
        run: sleep 5

      - name: Create project on VertraCloud (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Creating project '${PROJECT_NAME}'..."
          curl -s -X POST "${VERTRA_API_URL}/projects" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"${PROJECT_NAME}"'"}' | tee project.create.json || true
          echo "Project creation response saved to project.create.json"

      - name: Create database (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Creating database '${DB_NAME}'..."
          curl -s -X POST "${VERTRA_API_URL}/projects/{project_id}/databases" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"${DB_NAME}"'","engine":"postgres","version":"15","plan":"db-small","credentials": {"username":"postgres","password":"'"SOME_SECURE_PASSWORD"'"}}' | tee db.create.json || true
          echo "Database creation response saved to db.create.json"

      - name: Create app (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Creating app '${APP_NAME}'..."
          curl -s -X POST "${VERTRA_API_URL}/projects/{project_id}/apps" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"name":"'"${APP_NAME}"'","image":"'"docker.io/${IMAGE_NAME}:${IMAGE_TAG}"'","env": {"DATABASE_URL":"<CONN_STR>","NODE_ENV":"production","PORT":"3000","SETUP_TOKEN":"changeme"}}' | tee app.create.json || true
          echo "App creation response saved to app.create.json"

      - name: Add domain to app (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Adding domain '${DOMAIN}' to app..."
          curl -s -X POST "${VERTRA_API_URL}/projects/{project_id}/apps/{app_id}/domains" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"domain":"'"${DOMAIN}"'"}' | tee domain.create.json || true
          echo "Domain creation response saved to domain.create.json"

      - name: Trigger deploy (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Triggering deploy (pull image)..."
          curl -s -X POST "${VERTRA_API_URL}/projects/{project_id}/apps/{app_id}/deploys" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"strategy":"pull_image","image":"'"docker.io/${IMAGE_NAME}:${IMAGE_TAG}"'"}' | tee deploy.json || true
          echo "Deploy response saved to deploy.json"

      - name: Run seed via platform (placeholder)
        env:
          VERTRA_API_KEY: ${{ secrets.VERTRA_API_KEY }}
        run: |
          set -euo pipefail
          echo "Running seed via VertraCloud run API..."
          curl -s -X POST "${VERTRA_API_URL}/projects/{project_id}/apps/{app_id}/run" \
            -H "Authorization: Bearer ${VERTRA_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"command":"node scripts/seed.js","env": {"DATABASE_URL":"<CONN_STR>"}}' | tee run.json || true
          echo "Run response saved to run.json"
